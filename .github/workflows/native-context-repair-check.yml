name: Native context PG repair validation
on:
  push:
    branches: [c0/m3-1-native-context-repair-check-r1]
permissions:
  contents: read
jobs:
  generic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: asm-repair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f211272e14598db79f54b768a1bfa9d410dd59d4
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact candidate and prepare one-use TEST checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f211272e14598db79f54b768a1bfa9d410dd59d4
          test "$(git rev-parse HEAD^{tree})" = 087d72c9e9d941a2ca88f3b37efcc9327ca0b51f
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(docker ps -aq)$(docker volume ls -q)"
          mkdir -p reports "$RUNNER_TEMP/repair-tools"
          python3 - <<'BIND'
          import json, os, pathlib
          pathlib.Path('reports/binding.json').write_text(json.dumps({'candidate': 'f211272e14598db79f54b768a1bfa9d410dd59d4', 'tree': '087d72c9e9d941a2ca88f3b37efcc9327ca0b51f', 'workflow_sha': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}, indent=2) + '\n')
          BIND
          cat > "$RUNNER_TEMP/repair-tools/repair_checks.py" <<'PY'
          """One-use TEST runner embedded in the separate validation workflow."""
          import hashlib
          import json
          import os
          import runpy
          import subprocess
          import sys
          from pathlib import Path

          REPORTS = Path('/repair-evidence')
          FILES = [
              'tests/test_m1_3_c0_acceptance.py', 'tests/test_m1_3_postgres.py',
              'tests/test_m2_3_api_postgres.py', 'tests/test_m2_3_db_postgres.py',
              'tests/test_m2_3_schema_postgres.py', 'tests/test_m3_1_guards_migrations.py',
              'tests/test_m3_1_migrations.py', 'tests/test_m3_1_provenance_migrations.py',
              'tests/test_m3_1_control_api_postgres.py', 'tests/test_m3_1_control_postgres.py',
              'tests/test_m3_1_guards_postgres.py', 'tests/test_m3_1_turns_postgres.py',
              'tests/test_m3_2_escalations_migrations.py', 'tests/test_postgres.py',
              'tests/test_telegram_egress_postgres.py',
          ]


          def pytest_collection_finish(session):
              expected = json.loads((REPORTS / (os.environ['REPAIR_PHASE'] + '-expected.json')).read_text())
              assert [item.nodeid for item in session.items] == expected
              assert not any(item.get_closest_marker(m) for item in session.items for m in ('skip', 'skipif', 'xfail'))


          def pytest_runtest_logreport(report):
              with (REPORTS / (os.environ['REPAIR_PHASE'] + '-phases.jsonl')).open('a') as out:
                  out.write(json.dumps({'nodeid': report.nodeid, 'when': report.when,
                                        'outcome': report.outcome, 'seconds': report.duration}) + '\n')


          def main():
              from sqlalchemy.engine import make_url

              assert os.environ['ASM_ENVIRONMENT'] == 'TEST'
              secrets = []
              for key in ('ASM_DATABASE_URL', 'ASM_MIGRATION_DATABASE_URL', 'ASM_ADMIN_DATABASE_URL'):
                  url = make_url(os.environ[key])
                  assert url.database == 'asm_test' and url.host == 'postgres-test'
                  secrets.extend([os.environ[key], url.password])
              secrets.extend(os.environ[k] for k in ('ASM_STORAGE_ACCESS_KEY', 'ASM_STORAGE_SECRET_KEY'))

              def sanitize(value):
                  for secret in sorted(set(secrets), key=len, reverse=True):
                      if secret:
                          value = value.replace(secret, '[REDACTED]')
                  return value

              def run(args, label, *, env=None):
                  result = subprocess.run(args, capture_output=True, text=True, env=env)
                  output = sanitize(result.stdout + result.stderr)
                  (REPORTS / (label + '.log')).write_text(output)
                  print(label, 'exit', result.returncode, flush=True)
                  if result.returncode:
                      print(output, flush=True)
                      raise SystemExit(result.returncode)

              try:
                  catalog = runpy.run_path('scripts/native_context_db_catalog.py')
                  inventories = {}
                  for part in ('all-pg', 'native', 'generic-pg'):
                      dest = REPORTS / (part + '.json')
                      run([sys.executable, 'scripts/native_context_db_catalog.py', 'collect-' + part,
                           '--inventory', str(dest)], 'collect-' + part)
                      inventories[part] = json.loads(dest.read_text())
                  proof = catalog['validate_partition'](inventories['all-pg'], inventories['native'], inventories['generic-pg'])
                  assert (proof['all_pg'], proof['generic_pg'], proof['native_pg'], proof['native_total']) == (907, 802, 105, 112)
                  generic = inventories['generic-pg']['nodeids']
                  assert hashlib.sha256(('\n'.join(generic) + '\n').encode()).hexdigest() == 'bde64cc7fbfd35daa02e8141adcaec0723427ed6c2cfeef4b5e15402e8b1d283'
                  (REPORTS / 'partition.json').write_text(json.dumps(proof, indent=2) + '\n')
                  run([sys.executable, '-m', 'alembic', 'upgrade', 'head'], 'upgrade')
                  run([sys.executable, '-m', 'alembic', 'upgrade', 'head'], 'repeat-upgrade')
                  for phase, args in (
                      ('focused', ['-q', '-m', 'integration', *sorted(FILES)]),
                      ('generic', catalog['integration_arguments']()),
                  ):
                      expected = [node for node in generic if phase == 'generic' or node.split('::')[0] in FILES]
                      (REPORTS / (phase + '-expected.json')).write_text(json.dumps(expected) + '\n')
                      env = dict(os.environ, REPAIR_PHASE=phase, PYTEST_DISABLE_PLUGIN_AUTOLOAD='1',
                                 PYTHONPATH='/repair-tools:/app/backend/src')
                      run([sys.executable, '-m', 'pytest', *args, '--tb=short', '-p', 'pytest_asyncio.plugin',
                           '-p', 'repair_checks', '--junitxml=' + str(REPORTS / (phase + '.xml'))], phase, env=env)
                      records = [json.loads(line) for line in (REPORTS / (phase + '-phases.jsonl')).read_text().splitlines()]
                      assert [(r['nodeid'], r['when']) for r in records] == [(node, stage) for node in expected for stage in ('setup', 'call', 'teardown')]
                      assert all(r['outcome'] == 'passed' for r in records)
                      print(phase, len(expected), 'PASS;', len(records), 'phases PASS', flush=True)
                  run([sys.executable, '-m', 'alembic', 'downgrade', 'base'], 'final-downgrade')
                  run([sys.executable, '-m', 'alembic', 'upgrade', 'head'], 'final-restore')
              finally:
                  for path in REPORTS.iterdir():
                      if path.suffix in {'.log', '.json', '.jsonl', '.xml'}:
                          path.write_text(sanitize(path.read_text()))


          if __name__ == '__main__':
              main()
          PY
          python3 scripts/init_local.py
      - name: Build locked TEST checks
        run: docker compose --env-file infra/images.lock.env --env-file .env --profile test build --pull checks
      - name: Affected PG scenarios then complete generic802
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file infra/images.lock.env --env-file .env --profile test run --rm \
            --volume "$PWD/reports:/repair-evidence:rw" \
            --volume "$RUNNER_TEMP/repair-tools:/repair-tools:ro" \
            --user "$(id -u):$(id -g)" checks python /repair-tools/repair_checks.py
      - name: Owned TEST cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f .env; then
            docker compose --env-file infra/images.lock.env --env-file .env --profile test down --remove-orphans --volumes
          fi
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
      - name: Record exact source and require clean checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
          test ! -s reports/worktree-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-generic-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
