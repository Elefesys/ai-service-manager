name: M0 verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run real browser, API and PostgreSQL journeys
        run: sh scripts/test_browser.sh
      - name: Require unchanged tracked and untracked source
        run: test -z "$(git status --porcelain --untracked-files=all)"
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify canonical architecture sources
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python3 scripts/import_architecture.py docs/architecture 2>&1 | tee reports/architecture.log
      - name: Build, PostgreSQL integration, contracts and reproducibility
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          sh scripts/ci.sh 2>&1 | tee reports/ci.log
      - name: Require unchanged tracked and untracked source
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record tested source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-verification-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  docker29-compatibility:
    # Disposable GitHub runner only. Never install/replace an owner VM daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact official Engine and Compose for the reported boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          curl --fail --silent --show-error --location --max-time 60 https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/asm-docker.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/asm-docker.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
          sudo install -m 0644 "$RUNNER_TEMP/asm-docker.asc" /etc/apt/keyrings/asm-docker.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/asm-docker.asc] https://download.docker.com/linux/ubuntu noble stable' > "$RUNNER_TEMP/asm-docker.list"
          sudo apt-get update -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends --allow-downgrades -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=- docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble
          curl --fail --silent --show-error --location --max-time 120 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/asm-compose"
          printf '%s  %s\n' db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 "$RUNNER_TEMP/asm-compose" | sha256sum --check --strict
          install -d -m 0700 "$HOME/.docker/cli-plugins"
          install -m 0755 "$RUNNER_TEMP/asm-compose" "$HOME/.docker/cli-plugins/docker-compose"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}/{{.Server.GitCommit}}')" = 29.8.2/8af9fe3
          test "$(docker compose version --short | sed 's/^v//')" = 5.5.1
          mkdir -p reports
          docker version --format '{{json .}}' > reports/docker29-version.json
          dpkg-query -W docker-ce docker-ce-cli containerd.io > reports/docker29-packages.txt
      - name: Reproduce old mapped-host failure without public DNS or Telegram
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/init_local.py
          docker compose --env-file infra/images.lock.env --env-file .env build --pull api
          python3 infra/telegram-egress/docker29_probe.py | tee reports/docker29-probe.log
      - name: Verify corrected dual-family route and durable recovery on exact Docker29
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/test_telegram_egress.sh 2>&1 | tee reports/docker29-egress.log
      - name: Require unchanged tracked and untracked source
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record compatibility source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docker29-compatibility-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
