name: M0 verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m0-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run real browser, API and PostgreSQL journeys
        run: sh scripts/test_browser.sh
      - name: Require unchanged tracked and untracked source
        run: test -z "$(git status --porcelain --untracked-files=all)"
  foundation-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tested_sha: ${{ steps.source.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify canonical architecture sources
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python3 scripts/import_architecture.py docs/architecture 2>&1 | tee reports/architecture.log
      - name: Build, PostgreSQL integration, contracts and reproducibility
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          sh scripts/ci.sh --foundation-core 2>&1 | tee reports/ci.log
      - name: Require unchanged tracked and untracked source
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record tested source
        id: source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
          printf 'tested_sha=%s\n' "$(cat reports/tested-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-verification-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  foundation-egress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tested_sha: ${{ steps.source.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare pinned LOCAL egress image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          printf 'FOUNDATION_EGRESS_SETUP_START\n'
          python3 scripts/init_local.py
          docker compose --env-file infra/images.lock.env --env-file .env build --pull api
          docker version --format '{{json .}}' > reports/egress-docker-version.json
          docker compose version --short > reports/egress-compose-version.txt
          printf 'FOUNDATION_EGRESS_SETUP_END\n'
      - name: Run all synthetic lifecycle and E01-E05 scenarios
        shell: bash
        run: |
          set -euo pipefail
          printf 'FOUNDATION_EGRESS_LIFECYCLE_START\n'
          sh scripts/test_telegram_egress.sh 2>&1 | tee reports/egress.log
          printf 'FOUNDATION_EGRESS_LIFECYCLE_END\n'
      - name: Clean disposable Compose environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'FOUNDATION_EGRESS_CLEANUP_START\n'
          if test -f .env; then
            docker compose --env-file infra/images.lock.env --env-file .env --profile test down --remove-orphans
          fi
          printf 'FOUNDATION_EGRESS_CLEANUP_END\n'
      - name: Require unchanged tracked and untracked source
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record tested egress source
        id: source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
          printf 'tested_sha=%s\n' "$(cat reports/tested-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: foundation-egress-normal-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  foundation:
    needs: [foundation-core, foundation-egress]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require both foundation jobs and the same tested source
        shell: bash
        env:
          CORE_RESULT: ${{ needs['foundation-core'].result }}
          EGRESS_RESULT: ${{ needs['foundation-egress'].result }}
          CORE_SOURCE: ${{ needs['foundation-core'].outputs.tested_sha }}
          EGRESS_SOURCE: ${{ needs['foundation-egress'].outputs.tested_sha }}
        run: |
          set -eu
          actual=$(git rev-parse HEAD)
          printf 'FOUNDATION_GATE_RUN=%s ATTEMPT=%s SOURCE=%s CORE_SOURCE=%s EGRESS_SOURCE=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$actual" "$CORE_SOURCE" "$EGRESS_SOURCE"
          sh scripts/check_foundation_gate.sh "$CORE_RESULT" "$EGRESS_RESULT"
          test "$actual" = "$GITHUB_SHA"
          test "$CORE_SOURCE" = "$actual"
          test "$EGRESS_SOURCE" = "$actual"
          printf 'FOUNDATION_SOURCE_PAIRING_PASS\n'
      - name: Require unchanged tracked and untracked source
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
  docker29-compatibility:
    # Disposable GitHub runner only. Never install/replace an owner VM daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install exact official Engine and Compose for the reported boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          curl --fail --silent --show-error --location --max-time 60 https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/asm-docker.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/asm-docker.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
          sudo install -m 0644 "$RUNNER_TEMP/asm-docker.asc" /etc/apt/keyrings/asm-docker.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/asm-docker.asc] https://download.docker.com/linux/ubuntu noble stable' > "$RUNNER_TEMP/asm-docker.list"
          sudo apt-get update -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends --allow-downgrades -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=- docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble
          curl --fail --silent --show-error --location --max-time 120 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/asm-compose"
          printf '%s  %s\n' db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 "$RUNNER_TEMP/asm-compose" | sha256sum --check --strict
          install -d -m 0700 "$HOME/.docker/cli-plugins"
          install -m 0755 "$RUNNER_TEMP/asm-compose" "$HOME/.docker/cli-plugins/docker-compose"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}/{{.Server.GitCommit}}')" = 29.8.2/8af9fe3
          test "$(docker compose version --short | sed 's/^v//')" = 5.5.1
          mkdir -p reports
          docker version --format '{{json .}}' > reports/docker29-version.json
          dpkg-query -W docker-ce docker-ce-cli containerd.io > reports/docker29-packages.txt
      - name: Reproduce old mapped-host failure without public DNS or Telegram
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/init_local.py
          docker compose --env-file infra/images.lock.env --env-file .env build --pull api
          python3 infra/telegram-egress/docker29_probe.py | tee reports/docker29-probe.log
      - name: Verify corrected dual-family route and durable recovery on exact Docker29
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/test_telegram_egress.sh 2>&1 | tee reports/docker29-egress.log
      - name: Require unchanged tracked and untracked source
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record compatibility source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docker29-compatibility-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  connect5-migration:
    # Independent disposable shards preserve the existing three verification jobs.
    name: connect5-migration (${{ matrix.docker }}, ${{ matrix.boundary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        docker: [normal, docker29]
        boundary: [intent, image, state]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact official Engine and Compose for the reported boundary
        if: matrix.docker == 'docker29'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          curl --fail --silent --show-error --location --max-time 60 https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/asm-docker.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/asm-docker.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
          sudo install -m 0644 "$RUNNER_TEMP/asm-docker.asc" /etc/apt/keyrings/asm-docker.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/asm-docker.asc] https://download.docker.com/linux/ubuntu noble stable' > "$RUNNER_TEMP/asm-docker.list"
          sudo apt-get update -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends --allow-downgrades -o Dir::Etc::sourcelist="$RUNNER_TEMP/asm-docker.list" -o Dir::Etc::sourceparts=- docker-ce=5:29.8.2-1~ubuntu.24.04~noble docker-ce-cli=5:29.8.2-1~ubuntu.24.04~noble
          curl --fail --silent --show-error --location --max-time 120 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/asm-compose"
          printf '%s  %s\n' db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 "$RUNNER_TEMP/asm-compose" | sha256sum --check --strict
          install -d -m 0700 "$HOME/.docker/cli-plugins"
          install -m 0755 "$RUNNER_TEMP/asm-compose" "$HOME/.docker/cli-plugins/docker-compose"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}/{{.Server.GitCommit}}')" = 29.8.2/8af9fe3
          test "$(docker compose version --short | sed 's/^v//')" = 5.5.1
          mkdir -p reports
          docker version --format '{{json .}}' > reports/docker29-version.json
          dpkg-query -W docker-ce docker-ce-cli containerd.io > reports/docker29-packages.txt
      - name: Verify completed recovery migration, real interruption and rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          docker version --format '{{json .}}' > reports/migration-docker-version.json
          docker compose version --short > reports/migration-compose-version.txt
          sh scripts/test_telegram_egress_migration.sh '${{ matrix.boundary }}' 2>&1 | tee reports/migration.log
      - name: Require unchanged tracked and untracked source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record migration source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git status --porcelain --untracked-files=all > reports/worktree-status.txt
          git archive --format=tar.gz HEAD > reports/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: connect5-migration-${{ matrix.docker }}-${{ matrix.boundary }}-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
