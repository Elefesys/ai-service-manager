name: Native context DB (owned stock lane)

on:
  push:
    branches: [c0/m3-1-native-context-db-stock-r1]

permissions:
  contents: read

jobs:
  native-context-db:
    if: github.repository == 'Elefesys/ai-service-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start whole-job budget and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TASK_ROOT="$RUNNER_TEMP/native-context-db"
          mkdir -p "$TASK_ROOT/evidence"
          date +%s > "$TASK_ROOT/job-start"
          echo 'Preparation started; no database has been created.' > "$TASK_ROOT/evidence/preparation.txt"
          printf '%s\n' "NATIVE_ROOT=$TASK_ROOT" \
            "UV_PROJECT_ENVIRONMENT=$TASK_ROOT/venv" \
            "UV_CACHE_DIR=$TASK_ROOT/uv-cache" \
            "RUFF_CACHE_DIR=$TASK_ROOT/ruff-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          check-latest: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.10.0'
          enable-cache: false
      - name: Install the frozen Python environment outside the checkout
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          uv sync --frozen --all-groups --python "$(command -v python)" > "$NATIVE_ROOT/evidence/uv-sync.log" 2>&1
      - name: Verify runner, run full carrier, compare fresh 0013 catalog, clean owned DB
        shell: bash
        env:
          NATIVE_PYTHON: ${{ runner.temp }}/native-context-db/venv/bin/python
        run: bash scripts/test_native_context_db.sh
      - name: Recover owned resources and verify clean source
        if: always()
        shell: bash
        run: python scripts/native_context_db_catalog.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-context-db-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-context-db/evidence/
          retention-days: 7
          if-no-files-found: error
