name: ai-service-manager
x-backend: &backend
  context: .
  dockerfile: infra/Dockerfile.backend
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:?Missing images.lock.env}
    UV_IMAGE: ${UV_IMAGE:?Missing images.lock.env}
x-telegram: &telegram
  ASM_TELEGRAM_ENABLED: ${ASM_TELEGRAM_ENABLED:-false}
  TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
  TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-}
  ASM_TELEGRAM_EXPECTED_BOT_ID: ${ASM_TELEGRAM_EXPECTED_BOT_ID:-}
  ASM_TELEGRAM_WEBHOOK_URL: ${ASM_TELEGRAM_WEBHOOK_URL:-}
x-runtime: &runtime
  <<: *telegram
  ASM_ENVIRONMENT: LOCAL
  ASM_DATABASE_URL: postgresql+psycopg://asm_runtime:${PG_RUNTIME_PASSWORD:?Run init_local.py}@postgres:5432/asm_local
  ASM_AUTH_ORIGINS: '${ASM_AUTH_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:8000","http://127.0.0.1:8000"]}'
  ASM_STORAGE_ENVIRONMENT: LOCAL
  ASM_STORAGE_ENDPOINT: ${ASM_STORAGE_ENDPOINT:-http://storage:9000}
  ASM_STORAGE_BUCKET: asm-private-local
  ASM_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run init_local.py}
  ASM_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run init_local.py}
services:
  storage:
    image: ${STORAGE_IMAGE:?Missing storage pin}
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?Run init_local.py}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Run init_local.py}
      MINIO_BROWSER: 'off'
    volumes: [storage-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
  storage-init:
    image: ${STORAGE_ADMIN_IMAGE:?Missing storage admin pin}
    entrypoint: [sh, /bootstrap.sh]
    environment: &storage-bootstrap
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:?Run init_local.py}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Run init_local.py}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run init_local.py}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run init_local.py}
      STORAGE_HOST: storage
      STORAGE_BUCKET: asm-private-local
    tmpfs: [/tmp]
    volumes: [./infra/storage/bootstrap.sh:/bootstrap.sh:ro]
    depends_on:
      storage: {condition: service_healthy}
  postgres:
    image: ${DB_IMAGE:?Missing images.lock.env}
    environment:
      POSTGRES_USER: asm_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Run init_local.py}
      POSTGRES_DB: asm_local
      ASM_MIGRATION_PASSWORD: ${PG_MIGRATION_PASSWORD:?Run init_local.py}
      ASM_RUNTIME_PASSWORD: ${PG_RUNTIME_PASSWORD:?Run init_local.py}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U asm_admin -d asm_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: asm-backend:local
    build: {<<: *backend, target: runtime}
    environment:
      ASM_MIGRATION_DATABASE_URL: postgresql+psycopg://asm_migrator:${PG_MIGRATION_PASSWORD:?Run init_local.py}@postgres:5432/asm_local
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: asm-backend:local
    build: {<<: *backend, target: runtime}
    environment: *runtime
    command: [uvicorn, "asm.foundation:create_app", --factory, --host, "0.0.0.0", --port, "8000", --no-access-log, --no-proxy-headers]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 3s
      timeout: 5s
      retries: 20
  worker:
    image: asm-backend:local
    build: {<<: *backend, target: runtime}
    environment: *runtime
    command: [python, -m, asm.foundation, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  scheduler:
    image: asm-backend:local
    build: {<<: *backend, target: runtime}
    environment: *runtime
    command: [python, -m, asm.foundation, scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  frontend:
    image: asm-frontend:local
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Missing images.lock.env}
        WEB_IMAGE: ${WEB_IMAGE:?Missing images.lock.env}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
  # Explicit operator services only. No live invocation or external send in normal CI.
  telegram-operator:
    profiles: [telegram-operator]
    build: {<<: *backend, target: development}
    environment:
      <<: *telegram
      ASM_ENVIRONMENT: LOCAL
      ASM_MIGRATION_DATABASE_URL: postgresql+psycopg://asm_migrator:${PG_MIGRATION_PASSWORD:?Run init_local.py}@postgres:5432/asm_local
      ASM_TELEGRAM_WORKSPACE_ID: ${ASM_TELEGRAM_WORKSPACE_ID:-}
      ASM_TELEGRAM_BUSINESS_ID: ${ASM_TELEGRAM_BUSINESS_ID:-}
      ASM_TELEGRAM_EXPECTED_OWNER_ID: ${ASM_TELEGRAM_EXPECTED_OWNER_ID:-}
      ASM_TELEGRAM_CONNECTION_ID: ${ASM_TELEGRAM_CONNECTION_ID:-}
      ASM_TELEGRAM_BILLING_CONTACT: ${ASM_TELEGRAM_BILLING_CONTACT:-}
      ASM_TELEGRAM_BILLING_FROM: ${ASM_TELEGRAM_BILLING_FROM:-}
      ASM_TELEGRAM_BILLING_UNTIL: ${ASM_TELEGRAM_BILLING_UNTIL:-}
    command: [python, scripts/provision_telegram_test.py]
    depends_on:
      migrate: {condition: service_completed_successfully}
  telegram-smoke:
    profiles: [telegram-smoke]
    build: {<<: *backend, target: development}
    environment:
      ASM_ENVIRONMENT: LOCAL
      ASM_STORAGE_ENDPOINT: ${ASM_STORAGE_ENDPOINT:-http://storage:9000}
      ASM_TELEGRAM_WORKSPACE_ID: ${ASM_TELEGRAM_WORKSPACE_ID:-}
      ASM_TELEGRAM_BUSINESS_ID: ${ASM_TELEGRAM_BUSINESS_ID:-}
      ASM_TELEGRAM_SMOKE_CONNECTION_ID: ${ASM_TELEGRAM_SMOKE_CONNECTION_ID:-}
      ASM_TELEGRAM_SMOKE_ORIGIN: ${ASM_TELEGRAM_SMOKE_ORIGIN:-}
      ASM_TELEGRAM_SMOKE_LOGIN: ${ASM_TELEGRAM_SMOKE_LOGIN:-}
      ASM_TELEGRAM_SMOKE_PASSWORD: ${ASM_TELEGRAM_SMOKE_PASSWORD:-}
      ASM_TELEGRAM_SMOKE_MARKER: ${ASM_TELEGRAM_SMOKE_MARKER:-}
      ASM_TELEGRAM_SMOKE_CONVERSATION_ID: ${ASM_TELEGRAM_SMOKE_CONVERSATION_ID:-}
      ASM_TELEGRAM_SMOKE_CLIENT_ID: ${ASM_TELEGRAM_SMOKE_CLIENT_ID:-}
      ASM_TELEGRAM_SMOKE_REPLY: ${ASM_TELEGRAM_SMOKE_REPLY:-}
      ASM_TELEGRAM_SMOKE_KEY: ${ASM_TELEGRAM_SMOKE_KEY:-}
      ASM_TELEGRAM_SMOKE_APPROVAL: ${ASM_TELEGRAM_SMOKE_APPROVAL:-}
    command: [python, scripts/smoke_telegram_test.py]
  telegram-ingress:
    profiles: [telegram-live]
    image: ${WEB_IMAGE:?Missing images.lock.env}
    # The operator owns the 0600 TLS keys; the pinned image remains unprivileged.
    user: "${ASM_TELEGRAM_INGRESS_UID:-65534}:${ASM_TELEGRAM_INGRESS_GID:-65534}"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Public HTTPS exists only when this profile/service is explicitly started.
    ports: ["443:443"]
    volumes:
      - ./.env.telegram.ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.env.telegram.tls:/run/tls:ro
    networks:
      default:
        aliases:
          - ${ASM_TELEGRAM_STORAGE_HOST:-files.telegram-test.invalid}
          - ${ASM_TELEGRAM_CONSOLE_HOST:-console.telegram-test.invalid}
    depends_on:
      frontend: {condition: service_started}
      storage: {condition: service_healthy}
  postgres-test:
    profiles: [test]
    image: ${DB_IMAGE:?Missing images.lock.env}
    environment:
      POSTGRES_USER: asm_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Run init_local.py}
      POSTGRES_DB: asm_test
      ASM_MIGRATION_PASSWORD: ${PG_MIGRATION_PASSWORD:?Run init_local.py}
      ASM_RUNTIME_PASSWORD: ${PG_RUNTIME_PASSWORD:?Run init_local.py}
    tmpfs: [/var/lib/postgresql]
    volumes:
      - ./infra/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U asm_admin -d asm_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  checks:
    profiles: [test]
    build: {<<: *backend, target: development}
    environment:
      ASM_ENVIRONMENT: TEST
      ASM_STORAGE_ENVIRONMENT: TEST
      ASM_STORAGE_ENDPOINT: http://storage-test:9000
      ASM_STORAGE_BUCKET: asm-private-test
      ASM_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Run init_local.py}
      ASM_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Run init_local.py}
      ASM_DATABASE_URL: postgresql+psycopg://asm_runtime:${PG_RUNTIME_PASSWORD:?Run init_local.py}@postgres-test:5432/asm_test
      ASM_MIGRATION_DATABASE_URL: postgresql+psycopg://asm_migrator:${PG_MIGRATION_PASSWORD:?Run init_local.py}@postgres-test:5432/asm_test
      # Disposable TEST-only administrator used by extension prerequisite lifecycle tests.
      ASM_ADMIN_DATABASE_URL: postgresql+psycopg://asm_admin:${PG_ADMIN_PASSWORD:?Run init_local.py}@postgres-test:5432/asm_test
    depends_on:
      postgres-test: {condition: service_healthy}
      storage-test-init: {condition: service_completed_successfully}
  storage-test:
    profiles: [test]
    image: ${STORAGE_IMAGE:?Missing storage pin}
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?Run init_local.py}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?Run init_local.py}
      MINIO_BROWSER: 'off'
    tmpfs: [/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
  storage-test-init:
    profiles: [test]
    image: ${STORAGE_ADMIN_IMAGE:?Missing storage admin pin}
    entrypoint: [sh, /bootstrap.sh]
    environment:
      <<: *storage-bootstrap
      STORAGE_HOST: storage-test
      STORAGE_BUCKET: asm-private-test
    tmpfs: [/tmp]
    volumes: [./infra/storage/bootstrap.sh:/bootstrap.sh:ro]
    depends_on:
      storage-test: {condition: service_healthy}
volumes:
  pgdata:
  storage-data:
